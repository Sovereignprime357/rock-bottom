[preset.0]
name="Windows"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/source_content.json,data/courier_canvas_metrics.json"
exclude_filter="tests/*,tools/*,web/*,data/parity_manifest.json"
export_path="../.build/3d/windows/RockBottom.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]
custom_template/debug="../.tools/templates/windows_debug_x86_64.exe"
custom_template/release="../.tools/templates/windows_release_x86_64.exe"
debug/export_console_wrapper=0
binary_format/embed_pck=true
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=false
application/product_name="ROCK BOTTOM - THE BLOCK"
application/company_name="VibeKoded"
application/file_description="Rock Bottom first-person slice"
application/file_version="0.1.0.0"
application/product_version="0.1.0.0"
application/export_angle=0
application/export_d3d12=0
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
shader_baker/enabled=false
ssh_remote_deploy/enabled=false

